name: Verify KQS Logbook Plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify pinned upstream logbook-kai 25.0.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .upstream
          curl --fail --location --silent --show-error -o .upstream/logbook.zip https://github.com/sakura0689/logbook-kai/releases/download/v25.0.8/logbook-kai_25.0.8.zip
          echo 'd24b2aba8658b1acc6f4081604ce4280091cc714519ada957f9eaa6d240943c5  .upstream/logbook.zip' | sha256sum -c -
          unzip -q .upstream/logbook.zip -d .upstream
          JAR="$(find .upstream -name logbook-kai.jar -type f -print -quit)"
          test -n "$JAR"
          echo "LOGBOOK_JAR=$JAR" >> "$GITHUB_ENV"
      - name: Compile KQS against real logbook-kai and test
        run: |
          set -euo pipefail
          bash scripts/build.sh
          bash scripts/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kqs-logbook-plugin-rc
          path: dist/*.jar
          if-no-files-found: error
